name: Deploy Bicep Templates

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Choose which template to deploy (enercare or bonus)"
        required: true
        default: "enercare"
      environment:
        description: "Target environment (dev, uat, prod)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Enercare Template
        run: |
          az group create -n rg-enercare-${{ github.event.inputs.environment }} -l canadacentral
          az deployment group create \
            --resource-group rg-enercare-${{ github.event.inputs.environment }} \
            --template-file bicep/_Base.ProficiencyTest.bicep \
            --parameters @bicep/parameters/${{ github.event.inputs.environment }}.parameters.json