name: Deploy Bicep Templates

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Choose which template to deploy (enercare or bonus)"
        required: true
        default: "enercare"
      environment:
        description: "Target environment (dev, uat, prod)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Enercare Template
        if: ${{ github.event.inputs.template == 'enercare' }}
        shell: bash
        run: |
          set -euo pipefail

          ENV="${{ github.event.inputs.environment }}"
          RG="rg-enercare-${ENV}"
          LOCATION="canadacentral"

          az group create -n "$RG" -l "$LOCATION" --only-show-errors --output none

          # If your dev.parameters.json already defines service/workload, you can drop the two inline params below.
          az deployment group create \
            --resource-group "$RG" \
            --template-file bicep/_Base.ProficiencyTest.bicep \
            --parameters @bicep/parameters/${ENV}.parameters.json \
            --only-show-errors --output jsonc

      # Example placeholder if you later add a bonus template:
      - name: Deploy Bonus Template
        if: ${{ github.event.inputs.template == 'bonus' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Bonus template not implemented yet."