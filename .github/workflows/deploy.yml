name: Deploy Bicep Templates

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Choose which template to deploy (enercare or bonus)"
        required: true
        default: "enercare"
      environment:
        description: "Target environment (dev, uat, prod)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Enercare Template
        if: ${{ github.event.inputs.template == 'enercare' }}
        shell: bash
        run: |
          set -euo pipefail

          ENV="${{ github.event.inputs.environment }}"
          RG="rg-int-ga-${ENV}-cc"
          LAW="law-int-ga-${ENV}-cc"
          LOCATION="canadacentral"

          echo "➡️ Ensuring Resource Group exists: $RG"
          az group create -n "$RG" -l "$LOCATION" --only-show-errors --output none

          echo "➡️ Ensuring Log Analytics Workspace exists: $LAW"
          az monitor log-analytics workspace create \
            --resource-group "$RG" \
            --workspace-name "$LAW" \
            --location "$LOCATION" \
            --only-show-errors --output none || true

          LAW_ID=$(az monitor log-analytics workspace show \
            --resource-group "$RG" \
            --workspace-name "$LAW" \
            --query id -o tsv)

          echo "➡️ Deploying Bicep template with LAW: $LAW_ID"
          az deployment group create \
            --resource-group "$RG" \
            --template-file bicep/_Base.ProficiencyTest.bicep \
            --parameters @bicep/parameters/${ENV}.parameters.json \
            --parameters logAnalyticsWorkspaceResourceId="$LAW_ID" \
            --only-show-errors --output jsonc

      - name: Deploy Bonus Template
        if: ${{ github.event.inputs.template == 'bonus' }}
        shell: bash
        run: |
          echo "Bonus template not implemented yet."